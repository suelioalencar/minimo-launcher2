name: Android Build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS APKs
        run: ./gradlew assembleFoss --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: minimo-launcher-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: minimo-launcher-foss-release
          path: app/build/outputs/apk/foss/release/*.apk
